version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Database Layer: MongoDB 7.0
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: supplysense-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: supplysense
    volumes:
      - mongo-data:/data/db
    networks:
      - supplysense-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Backend API Layer: Node.js 18 + Express REST API
  # ---------------------------------------------------------------------------
  backend:
    image: node:18-alpine
    container_name: supplysense-backend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/supplysense
      - API_KEY=supplysense_secure_api_key_2024
      - CLIENT_URL=http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "if [ -f package.json ]; then npm install && npm start; else echo 'Backend source directory not mounted or missing package.json' && sleep 3600; fi"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - supplysense-net

  # ---------------------------------------------------------------------------
  # Frontend Dashboard Layer: Node.js 18 + React + Recharts
  # ---------------------------------------------------------------------------
  frontend:
    image: node:18-alpine
    container_name: supplysense-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:5000/api
      - REACT_APP_API_KEY=supplysense_secure_api_key_2024
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "if [ -f package.json ]; then npm install && npm start; else echo 'Frontend source directory not mounted or missing package.json' && sleep 3600; fi"
    depends_on:
      - backend
    networks:
      - supplysense-net

# -----------------------------------------------------------------------------
# Persistent Volumes & Network Configurations
# -----------------------------------------------------------------------------
volumes:
  mongo-data:
    name: supplysense-mongo-data
    driver: local

networks:
  supplysense-net:
    name: supplysense-network
    driver: bridge
